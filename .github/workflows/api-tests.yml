name: API tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Pytest API (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API tests and generate JUnit report
        run: python -m pytest tests/test_users_api.py -v --junitxml=reports/api-results.xml

      - name: Upload Pytest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-api-junit
          path: reports/api-results.xml
          if-no-files-found: warn
          retention-days: 7
